[project]
name = "multi-database-ai-query-agent"
version = "0.1.0"
description = "Schema-discovering, read-only PostgreSQL analytics through MCP and Claude"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26,<2", "anthropic>=0.79,<1", "sqlalchemy>=2.0.46,<3",
  "psycopg[binary]>=3.3,<4", "pydantic>=2.12,<3", "pydantic-settings>=2.12,<3",
  "sqlglot>=28,<31", "rich>=14,<15", "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires seeded PostgreSQL databases"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
